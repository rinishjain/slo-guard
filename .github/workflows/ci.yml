name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  schedule:
    # Daily re-check for new CVEs at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  # ── Unit & Regression Tests ─────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate golden regression files
        run: python scripts/generate_golden.py

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --tb=short \
            --cov=slo_guard \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --cov-config=pyproject.toml

      - name: Run regression tests
        run: |
          pytest tests/regression/ \
            --tb=short \
            -v \
            --cov=slo_guard \
            --cov-append \
            --cov-config=pyproject.toml

  # ── Dependency Vulnerability Scanning ───────────────────────────────────────
  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Run pip-audit
        # Skip local editable installs (not on PyPI); fail on any known vuln
        run: pip-audit --skip-editable --vulnerability-service pypi

  # ── Secret Scanning ──────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git-aware scanning

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Static Analysis (optional, non-blocking on first run) ────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install ruff mypy

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check slo_guard/ tests/

      - name: Run mypy
        run: mypy slo_guard/ --ignore-missing-imports

  # ── Build check ──────────────────────────────────────────────────────────────
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
